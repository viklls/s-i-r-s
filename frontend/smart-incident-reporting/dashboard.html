<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Smart Incident Reporting</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Cinzel:wght@400;500&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .top-bar { display: flex; justify-content: flex-end; align-items: center; gap: 16px; margin-bottom: 4px; }
    .user-info { font-family: var(--font-body); font-style: italic; font-size: .95rem; color: var(--text-secondary); }
    .btn-logout { background: none; border: none; font-family: var(--font-ui); font-size: .65rem; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); cursor: pointer; text-decoration: underline; transition: color .2s; }
    .btn-logout:hover { color: var(--text-primary); }

    .filters-bar {
      display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap;
      margin-bottom: 18px; padding: 14px 16px;
      border: 1px dashed var(--border-dashed, #d0c8be);
      background: var(--bg-subtle, #faf7f2);
    }
    .filters-bar .field-inline { margin: 0; }
    .filters-bar .field-label { font-size: .7rem; }
    .filters-bar select { min-width: 160px; }
    .filter-reset-btn {
      background: none; border: 1px solid var(--border);
      padding: 8px 14px; font-family: var(--font-ui); font-size: .7rem;
      letter-spacing: .08em; text-transform: uppercase; color: var(--text-secondary); cursor: pointer;
    }
    .filter-reset-btn:hover { background: #fff; }

    /* IoT badge in incident list */
    .iot-badge {
      display: inline-block;
      font-family: var(--font-ui);
      font-size: .58rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 2px 7px;
      background: linear-gradient(135deg, #1a3a5a 0%, #2a5a8a 100%);
      color: #fff;
      margin-right: 8px;
      vertical-align: middle;
      border-radius: 2px;
    }

    /* Modal */
    #incident-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100; }
    #incident-modal {
      display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: #fff; width: min(720px, 92vw); max-height: 90vh; overflow-y: auto;
      padding: 28px 32px; border: 1px solid var(--border);
      box-shadow: 0 20px 60px rgba(0,0,0,.2); z-index: 101;
    }
    .modal-close { position: absolute; top: 14px; right: 18px; background: none; border: none; font-size: 1.6rem; cursor: pointer; color: var(--text-muted); line-height: 1; }
    .modal-close:hover { color: var(--text-primary); }

    .modal-title { font-family: var(--font-display); font-size: 1.6rem; font-weight: 400; margin-bottom: 8px; padding-right: 30px; }
    .modal-subtitle { font-family: var(--font-body); font-style: italic; color: var(--text-muted); font-size: .9rem; margin-bottom: 18px; }
    .modal-section { margin-bottom: 18px; }
    .modal-section-label { font-family: var(--font-ui); font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; display: block; }
    .modal-section-value { font-family: var(--font-body); font-size: 1rem; line-height: 1.5; color: var(--text-primary); }
    .modal-section-value.long { white-space: pre-wrap; min-height: 60px; padding: 12px 14px; border: 1px solid var(--border); background: var(--bg-subtle); }
    .modal-meta-row { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 18px; }
    .modal-meta-row .modal-section { margin-bottom: 0; flex: 1 1 180px; }

    /* Device info box */
    .device-box {
      border: 1px solid #a0b8d0;
      background: #f0f5fa;
      padding: 14px 18px;
      margin-bottom: 18px;
    }
    .device-box-title {
      font-family: var(--font-ui);
      font-size: .68rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #1a3a5a;
      margin-bottom: 10px;
      font-weight: 600;
    }
    .device-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 24px; }
    .device-field-label { font-size: .65rem; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); }
    .device-field-value { font-family: var(--font-body); font-size: .95rem; color: var(--text-primary); }

    .status-control { display: flex; gap: 8px; align-items: center; }
    .status-control select { min-width: 160px; }
    .btn-save-status {
      font-family: var(--font-ui); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase;
      padding: 8px 14px; cursor: pointer; border: 1px solid #2a5a3a; background: #2a5a3a; color: #fff;
    }
    .btn-save-status:hover { background: #1f4a2c; }
    .btn-save-status:disabled { opacity: .5; cursor: not-allowed; }

    .modal-actions-bar { display: flex; gap: 10px; margin: 18px 0; justify-content: flex-end; flex-wrap: wrap; }
    .btn-action { font-family: var(--font-ui); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; padding: 8px 16px; cursor: pointer; border: 1px solid var(--border); background: #fff; }
    .btn-edit { color: #2a5a3a; border-color: #a0c0a8; }
    .btn-edit:hover { background: #dde8e0; }
    .btn-delete { color: #b33; border-color: #e0b0b0; }
    .btn-delete:hover { background: #fdf0f0; }

    .comment-admin { background: #faf6ee; border-color: #d8c8a8 !important; }
    .comment-role-admin { display: inline-block; font-family: var(--font-ui); font-size: .58rem; letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; background: #2a5a3a; color: #fff; margin-left: 8px; }
    .comment-role-user { display: inline-block; font-family: var(--font-ui); font-size: .58rem; letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; background: #d8d0c8; color: #555; margin-left: 8px; }

    #edit-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; }
    #edit-modal {
      display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: #fff; width: min(560px, 90vw); max-height: 90vh; overflow-y: auto;
      padding: 28px 32px; border: 1px solid var(--border); box-shadow: 0 20px 60px rgba(0,0,0,.3); z-index: 201;
    }
    #edit-modal h3 { font-family: var(--font-display); font-size: 1.4rem; font-weight: 400; margin-bottom: 18px; }
    .modal-buttons-end { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    .btn-cancel { background: none; border: 1px solid var(--border); padding: 10px 22px; font-family: var(--font-ui); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; color: var(--text-secondary); }
    .btn-cancel:hover { background: var(--bg-subtle); }

    .incident-item { cursor: pointer; }
  </style>
</head>
<body>
<div class="shell">
  <div class="page-card">

    <div class="top-bar">
      <span class="user-info" id="user-name"></span>
      <button class="btn-logout" id="logout-btn">Вийти</button>
    </div>

    <h1 class="site-title">Smart Incident Reporting</h1>
    <p class="page-label">Dashboard</p>
    <hr class="header-divider">

    <div class="incidents-header">
      <h2 class="incidents-title">All Incidents</h2>
      <a class="btn-create-new" href="create.html" id="btn-create">+ CREATE NEW</a>
    </div>

    <div class="filters-bar">
      <div class="field-inline">
        <label class="field-label" for="filter-status">Статус</label>
        <div class="select-wrap">
          <select class="field-select" id="filter-status">
            <option value="">— усі —</option>
            <option value="New">New</option>
            <option value="In Progress">In Progress</option>
            <option value="Resolved">Resolved</option>
          </select>
          <span class="select-arrow">∨</span>
        </div>
      </div>

      <div class="field-inline">
        <label class="field-label" for="filter-category">Категорія</label>
        <div class="select-wrap">
          <select class="field-select" id="filter-category">
            <option value="">— усі —</option>
          </select>
          <span class="select-arrow">∨</span>
        </div>
      </div>

      <div class="field-inline">
        <label class="field-label" for="filter-source">Джерело</label>
        <div class="select-wrap">
          <select class="field-select" id="filter-source">
            <option value="">— усі —</option>
            <option value="iot">🤖 Тільки IoT</option>
            <option value="human">👤 Тільки люди</option>
          </select>
          <span class="select-arrow">∨</span>
        </div>
      </div>

      <button class="filter-reset-btn" id="filter-reset">Скинути</button>
    </div>

    <div id="incidents-list"></div>
  </div>
</div>

<!-- INCIDENT DETAIL MODAL -->
<div id="incident-overlay"></div>
<div id="incident-modal">
  <button class="modal-close" id="incident-close-btn" type="button">×</button>

  <h2 class="modal-title" id="modal-title"></h2>
  <p class="modal-subtitle" id="modal-subtitle"></p>

  <div class="modal-section">
    <span class="modal-section-label">Description</span>
    <div class="modal-section-value long" id="modal-description"></div>
  </div>

  <div class="modal-meta-row">
    <div class="modal-section">
      <span class="modal-section-label">Категорія</span>
      <div class="modal-section-value" id="modal-category"></div>
    </div>
    <div class="modal-section">
      <span class="modal-section-label">Локація</span>
      <div class="modal-section-value" id="modal-location"></div>
    </div>
    <div class="modal-section">
      <span class="modal-section-label">Дата створення</span>
      <div class="modal-section-value" id="modal-date"></div>
    </div>
  </div>

  <div class="modal-meta-row">
    <div class="modal-section">
      <span class="modal-section-label">Автор</span>
      <div class="modal-section-value" id="modal-author"></div>
    </div>
    <div class="modal-section">
      <span class="modal-section-label">Статус</span>
      <div id="modal-status-wrap"></div>
    </div>
  </div>

  <!-- Device info (тільки для IoT-інцидентів) -->
  <div class="device-box" id="modal-device-box" style="display:none;">
    <div class="device-box-title">📡 IoT Device Information</div>
    <div class="device-grid">
      <div>
        <div class="device-field-label">Device name</div>
        <div class="device-field-value" id="device-name"></div>
      </div>
      <div>
        <div class="device-field-label">Sensor type</div>
        <div class="device-field-value" id="device-type"></div>
      </div>
      <div>
        <div class="device-field-label">Installation</div>
        <div class="device-field-value" id="device-location"></div>
      </div>
      <div>
        <div class="device-field-label">Last seen</div>
        <div class="device-field-value" id="device-last-seen"></div>
      </div>
    </div>
  </div>

  <div class="modal-actions-bar" id="modal-actions"></div>

  <p class="section-label" style="margin-top:10px;">Коментарі</p>
  <div id="modal-comments-list"></div>

  <div id="modal-comment-form" style="margin-top:20px;">
    <p class="section-label">Залишити коментар</p>
    <textarea class="field-input" id="modal-comment-input" style="min-height:70px; margin-bottom:10px;" placeholder="Ваш коментар..."></textarea>
    <button class="btn-primary" id="modal-add-comment-btn" style="max-width:200px;" type="button">Надіслати</button>
  </div>
</div>

<!-- EDIT MODAL -->
<div id="edit-overlay"></div>
<div id="edit-modal">
  <h3>Редагувати інцидент</h3>

  <div class="field-group">
    <label class="field-label" for="edit-title">Назва</label>
    <input class="field-input" id="edit-title" type="text">
  </div>

  <div class="field-group">
    <label class="field-label" for="edit-desc">Опис</label>
    <textarea class="field-input" id="edit-desc" style="min-height:90px;"></textarea>
  </div>

  <div class="fields-row">
    <div class="field-inline">
      <label class="field-label" for="edit-category">Категорія</label>
      <div class="select-wrap">
        <select class="field-select" id="edit-category"></select>
        <span class="select-arrow">∨</span>
      </div>
    </div>
    <div class="field-inline">
      <label class="field-label" for="edit-address">Локація</label>
      <input class="field-input" id="edit-address" type="text" style="width:220px;">
    </div>
  </div>

  <div class="modal-buttons-end">
    <button class="btn-cancel" id="edit-cancel-btn" type="button">Скасувати</button>
    <button class="btn-primary" id="edit-save-btn" style="max-width:160px;" type="button">Зберегти</button>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
