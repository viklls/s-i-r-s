<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Інцидент — Smart Incident Reporting</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Cinzel:wght@400;500&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .top-bar { display:flex; justify-content:flex-end; margin-bottom:4px; }
    .btn-logout { background:none; border:none; font-family:var(--font-ui); font-size:.65rem; font-weight:500; letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted); cursor:pointer; text-decoration:underline; }
    .btn-logout:hover { color:var(--text-primary); }

    .actions-bar {
      display: flex;
      gap: 10px;
      margin: 16px 0 0 0;
      justify-content: flex-end;
    }
    .btn-action {
      font-family: var(--font-ui);
      font-size: .7rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 8px 16px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #fff;
    }
    .btn-edit { color: #2a5a3a; border-color: #a0c0a8; }
    .btn-edit:hover { background: #dde8e0; }
    .btn-delete { color: #b33; border-color: #e0b0b0; }
    .btn-delete:hover { background: #fdf0f0; }

    .comment-admin {
      background: #faf6ee;
      border-color: #d8c8a8 !important;
    }
    .comment-role-admin {
      display: inline-block;
      font-family: var(--font-ui);
      font-size: .6rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 2px 8px;
      background: #2a5a3a;
      color: #fff;
      margin-left: 8px;
    }
    .comment-role-user {
      display: inline-block;
      font-family: var(--font-ui);
      font-size: .6rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 2px 8px;
      background: #d8d0c8;
      color: #555;
      margin-left: 8px;
    }

    #edit-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.4);
      z-index: 100;
    }
    #edit-modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      width: min(560px, 90vw);
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px 32px;
      border: 1px solid var(--border);
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
      z-index: 101;
    }
    #edit-modal h3 {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 400;
      margin-bottom: 18px;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
    }
    .btn-cancel {
      background: none;
      border: 1px solid var(--border);
      padding: 10px 22px;
      font-family: var(--font-ui);
      font-size: .72rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
      color: var(--text-secondary);
    }
    .btn-cancel:hover { background: var(--bg-subtle); }
  </style>
</head>
<body>
<div class="shell">
  <div class="page-card">

    <div class="top-bar">
      <button class="btn-logout" id="logout-btn">Вийти</button>
    </div>

    <h1 class="site-title">Smart Incident Reporting</h1>
    <p class="page-label">View incident</p>
    <hr class="header-divider">

    <a class="back-link" href="dashboard.html">Back to list</a>

    <div class="fieldset-box" id="incident-box">
      <span class="fieldset-legend">Інцидент</span>

      <div class="field-group">
        <label class="field-label">Назва</label>
        <div class="view-value" id="view-title"></div>
      </div>

      <div class="field-group">
        <label class="field-label">Опис</label>
        <div class="view-value" id="view-desc" style="min-height:80px;"></div>
      </div>

      <div class="fields-row">
        <div class="field-inline">
          <label class="field-label">Категорія</label>
          <div class="view-value" id="view-category" style="min-width:160px;"></div>
        </div>
        <div class="field-inline">
          <label class="field-label">Локація</label>
          <div class="view-value" id="view-location" style="min-width:200px;"></div>
        </div>
      </div>

      <div class="fields-row">
        <div class="field-inline">
          <label class="field-label">Статус</label>
          <!-- JS вставить сюди dropdown (Admin) або бейдж (User) -->
          <div id="status-wrap"></div>
        </div>
        <div class="field-inline" style="margin-left:auto;">
          <label class="field-label">Дата</label>
          <div class="view-value" id="view-date" style="min-width:140px;"></div>
        </div>
      </div>
    </div>

    <div class="actions-bar" id="actions-bar"></div>

    <p class="section-label">Коментарі</p>
    <div id="comments-list"></div>

    <div id="comment-form" style="display:none; margin-top:20px;">
      <p class="section-label">Залишити коментар</p>
      <textarea class="field-input" id="comment-input" style="min-height:70px; margin-bottom:10px;" placeholder="Ваш коментар..."></textarea>
      <button class="btn-primary" id="add-comment-btn" style="max-width:200px;">Надіслати</button>
    </div>

  </div>
</div>

<!-- Edit modal -->
<div id="edit-overlay"></div>
<div id="edit-modal">
  <h3>Редагувати інцидент</h3>

  <div class="field-group">
    <label class="field-label" for="edit-title">Назва</label>
    <input class="field-input" id="edit-title" type="text">
  </div>

  <div class="field-group">
    <label class="field-label" for="edit-desc">Опис</label>
    <textarea class="field-input" id="edit-desc" style="min-height:90px;"></textarea>
  </div>

  <div class="fields-row">
    <div class="field-inline">
      <label class="field-label" for="edit-category">Категорія</label>
      <div class="select-wrap">
        <select class="field-select" id="edit-category"></select>
        <span class="select-arrow">∨</span>
      </div>
    </div>
    <div class="field-inline">
      <label class="field-label" for="edit-address">Локація</label>
      <input class="field-input" id="edit-address" type="text" style="width:220px;">
    </div>
  </div>

  <div class="modal-actions">
    <button class="btn-cancel" id="edit-cancel-btn">Скасувати</button>
    <button class="btn-primary" id="edit-save-btn" style="max-width:160px;">Зберегти</button>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/view.js"></script>
</body>
</html>
