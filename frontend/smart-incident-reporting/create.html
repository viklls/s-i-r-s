<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Новий інцидент — Smart Incident Reporting</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Cinzel:wght@400;500&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .error-msg {
      font-family: var(--font-ui);
      font-size: .75rem;
      color: #b33;
      padding: 8px 12px;
      border: 1px solid #e0b0b0;
      background: #fdf0f0;
      margin-bottom: 16px;
      display: none;
    }
    .top-bar { display:flex; justify-content:flex-end; margin-bottom:4px; }
    .btn-logout { background:none; border:none; font-family:var(--font-ui); font-size:.65rem; font-weight:500; letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted); cursor:pointer; text-decoration:underline; }
    .btn-logout:hover { color:var(--text-primary); }
  </style>
</head>
<body>
<div class="shell">
  <div class="page-card">

    <div class="top-bar">
      <button class="btn-logout" id="logout-btn">Вийти</button>
    </div>

    <h1 class="site-title">Smart Incident Reporting</h1>
    <p class="page-label">Create new incident</p>
    <hr class="header-divider">

    <a class="back-link" href="dashboard.html">Back to list</a>

    <div id="form-error" class="error-msg"></div>

    <div class="fieldset-box">
      <span class="fieldset-legend">Новий інцидент</span>

      <div class="field-group">
        <label class="field-label" for="title">Назва</label>
        <input class="field-input" id="title" type="text">
      </div>

      <div class="field-group">
        <label class="field-label" for="description">Опис</label>
        <textarea class="field-input" id="description"></textarea>
      </div>

      <div class="fields-row">
        <div class="field-inline">
          <label class="field-label" for="category">Оберіть категорію</label>
          <div class="select-wrap">
            <select class="field-select" id="category">
              <option value="">— обрати —</option>
            </select>
            <span class="select-arrow">∨</span>
          </div>
        </div>
        <div class="field-inline">
          <label class="field-label" for="address">Локація</label>
          <input class="field-input" id="address" type="text" style="width:220px;" placeholder="вул. назва, номер">
        </div>
      </div>

      <button class="btn-primary" id="submit-btn">Create new incident</button>
    </div>

  </div>
</div>
<script src="js/app.js"></script>
<script src="js/create.js"></script>
</body>
</html>
